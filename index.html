<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ارتباط بی‌سیم با دوربین</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body {
            background-color: #2d222b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            position: relative;
        }

        /* کانتینر ویدیوهای دریافتی */
        #videoContainer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none; /* اجازه کلیک به لایه‌های زیرین */
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* فقط وقتی ویدیو می‌رسد نمایش داده می‌شود */
        }

        /* ویدیوی خودم (کوچک در گوشه) */
        #localVideo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 160px;
            background-color: #000;
            border: 2px solid #ff8eb3;
            border-radius: 10px;
            object-fit: cover;
            z-index: 5;
            display: none;
            transform: scaleX(-1); /* آینه کردن دوربین سلفی */
        }

        /* رابط کاربری اصلی */
        .ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .header { text-align: center; margin-top: 10px; }
        .status { font-size: 1.2rem; color: #b0a0ab; margin-bottom: 10px; }

        /* دکمه‌ها */
        .controls { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }

        .mic-button {
            width: 150px;
            height: 150px;
            background-color: rgba(79, 38, 70, 0.8);
            border: 6px solid #ff8eb3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 142, 179, 0.3);
            transition: all 0.1s ease;
            user-select: none;
            backdrop-filter: blur(5px);
        }

        .mic-button.active {
            background-color: #ff8eb3;
            box-shadow: 0 0 60px rgba(255, 142, 179, 0.9);
            transform: scale(0.95);
        }

        .mic-button svg { width: 70px; height: 70px; fill: white; transition: fill 0.1s; }
        .mic-button.active svg { fill: #2d222b; }

        .cam-button {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #b0a0ab;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cam-button.active { background-color: #ff8eb3; border-color: #ff8eb3; }
        .cam-button svg { width: 30px; height: 30px; fill: #b0a0ab; }
        .cam-button.active svg { fill: #2d222b; }

        .hint { margin-bottom: 20px; font-size: 1rem; color: #b0a0ab; text-align: center; }

    </style>
</head>
<body>

    <!-- کانتینر ویدیوهای دریافتی -->
    <div id="videoContainer">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
    </div>

    <!-- ویدیوی خودم -->
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- رابط کاربری اصلی -->
    <div class="ui-container">
        <div class="header">
            <div class="status" id="statusText">در حال راه‌اندازی...</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center;">
            <!-- دکمه‌های کنترل -->
            <div class="controls">
                <!-- دکمه دوربین -->
                <div class="cam-button" id="camBtn">
                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13H6v-2h8v2z"/></svg>
                </div>

                <!-- دکمه میکروفون -->
                <div class="mic-button" id="micBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>

                <!-- فضای خالی برای توازن -->
                <div style="width: 60px;"></div>
            </div>
            
            <div class="hint" id="hintText">برای صحبت، دکمه را نگه دارید</div>
        </div>
    </div>

    <script>
        const MAIN_ROOM_ID = "walkie-talkie-local-network-2024";
        
        let peer = null;
        let connections = [];
        let isHost = false;
        
        // صدا
        let audioStream = null;
        let mediaRecorder = null;
        
        // ویدیو
        let videoStream = null;
        let isCamActive = false;

        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');
        const camBtn = document.getElementById('camBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const hintText = document.getElementById('hintText');

        // --- منطق اتصال (مثل قبل) ---
        function init() {
            peer = new Peer();
            peer.on('open', () => { attemptToConnectToHost(); });
            peer.on('error', (err) => { if(err.type === 'peer-unavailable') { becomeHost(); } });
            peer.on('connection', (conn) => { 
                connections.push(conn); 
                setupConnection(conn); 
                updateStatus(); 
            });
            // دریافت تماس ویدیویی
            peer.on('call', (call) => {
                call.answer(videoStream); // اگر ویدیو داریم، پاسخ می‌دهیم
                call.on('stream', (remoteStream) => {
                    playRemoteVideo(remoteStream);
                });
            });
        }

        function attemptToConnectToHost() {
            const conn = peer.connect(MAIN_ROOM_ID);
            conn.on('open', () => { connections.push(conn); setupConnection(conn); updateStatus(); });
            setTimeout(() => {
                if (!conn.open) { peer.destroy(); becomeHost(); }
            }, 3000);
        }

        function becomeHost() {
            peer = new Peer(MAIN_ROOM_ID);
            peer.on('open', () => { isHost = true; updateStatus(); });
            peer.on('error', (err) => { if(err.type === 'unavailable-id') { init(); } });
            peer.on('connection', (conn) => { connections.push(conn); setupConnection(conn); updateStatus(); });
            
            peer.on('call', (call) => {
                call.answer(videoStream);
                call.on('stream', (remoteStream) => { playRemoteVideo(remoteStream); });
            });
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                if (isHost) {
                    connections.forEach(c => { if (c !== conn && c.open) c.send(data); });
                }
                playAudio(data);
            });
            conn.on('close', () => { connections = connections.filter(c => c !== conn); updateStatus(); });
        }

        function updateStatus() {
            if (isHost) {
                statusText.innerText = "شما میزبان هستید";
                statusText.style.color = "#ff8eb3";
            } else {
                statusText.innerText = "متصل شد. آماده";
                statusText.style.color = "#4caf50";
            }
        }

        // --- منطق صدا ---
        async function setupMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        connections.forEach(conn => { if (conn.open) conn.send(event.data); });
                    }
                };
                mediaRecorder.onstart = () => { micBtn.classList.add('active'); hintText.innerText = "در حال صحبت..."; };
                mediaRecorder.onstop = () => { micBtn.classList.remove('active'); hintText.innerText = "برای صحبت، دکمه را نگه دارید"; };
            } catch (err) { alert("دسترسی به میکروفون داده نشد!"); }
        }

        function playAudio(audioBlob) {
            const audioUrl = URL.createObjectURL(audioBlob);
            new Audio(audioUrl).play().catch(e => console.log(e));
        }

        // --- منطق ویدیو ---
        async function toggleCamera() {
            if (!isCamActive) {
                try {
                    // درخواست دسترسی به دوربین
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    
                    localVideo.srcObject = videoStream;
                    localVideo.style.display = 'block';
                    camBtn.classList.add('active');
                    isCamActive = true;

                    // تماس ویدیویی با همه افراد متصل
                    connections.forEach(conn => {
                        if (conn.open) {
                            peer.call(conn.peer, videoStream);
                        }
                    });

                } catch (err) {
                    alert("دسترسی به دوربین داده نشد!");
                }
            } else {
                // خاموش کردن دوربین
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                    videoStream = null;
                }
                localVideo.srcObject = null;
                localVideo.style.display = 'none';
                camBtn.classList.remove('active');
                isCamActive = false;
                remoteVideo.style.display = 'none'; // مخفی کردن ویدیوی دریافتی
            }
        }

        function playRemoteVideo(stream) {
            remoteVideo.srcObject = stream;
            remoteVideo.style.display = 'block'; // نمایش ویدیوی دریافتی
        }

        // --- رویدادها ---
        micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if (mediaRecorder && mediaRecorder.state === 'inactive') mediaRecorder.start(100); });
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (mediaRecorder && mediaRecorder.state === 'inactive') mediaRecorder.start(100); }, {passive: false});
        document.addEventListener('mouseup', () => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); });
        document.addEventListener('touchend', () => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); });

        camBtn.addEventListener('click', toggleCamera);

        // شروع
        init();
        setupMicrophone();
    </script>
</body>
</html>
